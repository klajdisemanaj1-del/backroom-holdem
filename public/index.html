<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Poker888</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <section id="v-auth" class="screen" hidden>
    <div class="scroll">
      <div class="auth-wrap">
        <header class="brand">
          <div class="suits">♠ <span class="r">♥</span> <span class="r">♦</span> ♣</div>
          <h1>Poker888</h1>
        </header>
        <form id="auth-form" class="panel" autocomplete="on">
          <h2 id="auth-title">Hyr / Log in</h2>
          <div class="field"><label class="lab" for="a-user">Perdoruesi / Username</label>
            <input id="a-user" class="txt" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
          <div class="field"><label class="lab" for="a-pass">Fjalekalimi / Password</label>
            <input id="a-pass" class="txt" type="password" autocomplete="current-password" required></div>
          <button class="btn gold" type="submit" id="a-go">Hyr / Log in</button>
          <p class="note" id="auth-note"></p>
        </form>
      </div>
    </div>
  </section>

  <section id="v-lobby" class="screen" hidden>
    <header class="bar">
      <div class="brand-sm">Poker888</div>
      <span class="spacer"></span>
      <span class="bal" id="l-bal"></span>
      <button class="icon" data-act="account" aria-label="My account">☰</button>
    </header>
    <div class="scroll">
      <div class="inner">
        <div id="l-casino" class="list"></div>
        <h2 class="sect">Poker tables</h2>
        <div id="l-tables" class="list"></div>
      </div>
    </div>
  </section>

  <section id="v-table" class="screen" hidden>
    <header class="bar">
      <button class="icon" data-act="back" aria-label="Back">‹</button>
      <div class="tinfo"><span class="code" id="t-label"></span><span class="meta" id="t-meta"></span></div>
      <span id="t-badge"></span>
      <button class="icon" data-act="tablemenu" aria-label="Table menu">☰</button>
    </header>
    <div id="arena">
      <div class="felt" id="felt"><div class="rail"></div><div class="baize"><div class="crest" aria-hidden="true"><span class="cs">♠ <i>♥</i></span><span class="cn">Poker888</span><span class="cs"><i>♦</i> ♣</span></div></div></div>
      <div id="bets"></div>
      <div id="center"><div id="pot"></div><div id="board"></div><div id="banner"></div></div>
      <div id="seats"></div>
      <div class="dealer" id="dealer" hidden>D</div>
    </div>
    <div id="dock"></div>
  </section>

  <section id="v-bj" class="screen" hidden>
    <header class="bar">
      <button class="icon" data-act="back" aria-label="Back">‹</button>
      <div class="tinfo"><span class="code">Blackjack</span><span class="meta" id="bj-meta"></span></div>
      <span class="bal" id="bj-bal"></span>
    </header>
    <div id="bj-arena">
      <div class="bj-fig" id="bj-fig" aria-hidden="true"><svg viewBox="90 16 200 246" xmlns="http://www.w3.org/2000/svg">
          <g class="f-body">
            <path d="M96 262 C96 252 102 222 128 214 C148 209 170 208 190 208 C210 208 232 209 252 214 C278 222 284 252 284 262 Z" fill="#f3eeee"/>
            <path d="M104 262 C108 240 128 222 166 211 L190 262 L214 211 C252 222 272 240 276 262 Z" fill="#161214"/>
            <path d="M166 211 L190 262 L214 211 L202 207 L190 222 L178 207 Z" fill="#f3eeee"/>
            <circle cx="190" cy="250" r="3.5" fill="#c41a30"/>
            <rect x="179" y="168" width="22" height="28" rx="8" fill="#e3ad8f"/>
            <path d="M171 205 L190 199 L190 213 Z" fill="#d0142c"/><path d="M209 205 L190 199 L190 213 Z" fill="#d0142c"/>
            <rect x="185" y="200" width="10" height="11" rx="3" fill="#a3111f"/>
          </g>
          <g class="f-head">
            <ellipse cx="190" cy="108" rx="56" ry="62" fill="#2b1916"/>
            <circle cx="190" cy="44" r="23" fill="#2b1916"/>
            <path d="M172 40 C182 30 198 30 208 40" fill="none" stroke="#c41a30" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="145" cy="128" rx="7" ry="10" fill="#e3ad8f"/><ellipse cx="235" cy="128" rx="7" ry="10" fill="#e3ad8f"/>
            <circle cx="145" cy="141" r="3" fill="#d0142c"/><circle cx="235" cy="141" r="3" fill="#d0142c"/>
            <ellipse cx="190" cy="124" rx="44" ry="52" fill="#eab898"/>
            <path d="M146 112 C150 76 178 62 206 68 C224 72 236 88 236 110 C222 96 204 90 186 92 C170 94 156 102 146 112 Z" fill="#2b1916"/>
            <g class="f-brows">
              <path d="M160 108 C166 103 175 103 181 107" fill="none" stroke="#3b2620" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M199 107 C205 103 214 103 220 108" fill="none" stroke="#3b2620" stroke-width="2.5" stroke-linecap="round"/>
            </g>
            <g class="f-eyes">
              <ellipse cx="171" cy="121" rx="8" ry="5.5" fill="#ffffff"/><ellipse cx="209" cy="121" rx="8" ry="5.5" fill="#ffffff"/>
              <circle cx="172" cy="121" r="4" fill="#4a2c22"/><circle cx="210" cy="121" r="4" fill="#4a2c22"/>
              <circle cx="173.5" cy="119.5" r="1.3" fill="#ffffff"/><circle cx="211.5" cy="119.5" r="1.3" fill="#ffffff"/>
              <path d="M162 117 C166 113 176 113 180 117" fill="none" stroke="#2b1916" stroke-width="2" stroke-linecap="round"/>
              <path d="M200 117 C204 113 214 113 218 117" fill="none" stroke="#2b1916" stroke-width="2" stroke-linecap="round"/>
              <rect class="f-lid" x="162" y="115" width="18" height="12" fill="#eab898"/><rect class="f-lid" x="200" y="115" width="18" height="12" fill="#eab898"/>
            </g>
            <g class="f-joy">
              <path d="M163 123 C167 116 176 116 180 123" fill="none" stroke="#2b1916" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M200 123 C204 116 213 116 217 123" fill="none" stroke="#2b1916" stroke-width="2.6" stroke-linecap="round"/>
            </g>
            <path d="M190 126 C188 134 187 139 192 140" fill="none" stroke="#c98d70" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="160" cy="140" rx="9" ry="5" fill="#f2a1a0" opacity="0.55"/><ellipse cx="220" cy="140" rx="9" ry="5" fill="#f2a1a0" opacity="0.55"/>
            <g class="f-smile"><path d="M174 150 C182 160 198 160 206 150 C198 155 182 155 174 150 Z" fill="#b8323f"/>
              <path d="M176 151 C184 157 196 157 204 151" fill="none" stroke="#8e1f2b" stroke-width="1.5" stroke-linecap="round"/></g>
            <g class="f-grin"><path d="M172 148 C180 166 200 166 208 148 Z" fill="#7a0b1a"/><path d="M175 149 L205 149 L203 153 L177 153 Z" fill="#ffffff"/></g>
            <g class="f-meh"><path d="M180 154 C186 151 194 151 200 154" fill="none" stroke="#8e1f2b" stroke-width="2.5" stroke-linecap="round"/></g>
          </g>
        </svg></div>
      <div class="bj-felt">
        <div class="bj-zone"><div class="bj-lab">Dealer <span class="bj-tot" id="bj-dt"></span></div><div class="bj-cards" id="bj-dcards"></div></div>
        <div class="bj-rules"><b>Blackjack pays 3 to 2</b><span>Dealer stands on soft 17 · Insurance pays 2 to 1</span></div>
        <div class="bj-msg" id="bj-msg"></div>
        <div class="bj-hands" id="bj-hands"></div>
      </div>
    </div>
    <div id="bj-dock"></div>
  </section>

  <section id="v-admin" class="screen" hidden>
    <header class="bar">
      <div class="brand-sm">Club admin</div>
      <span class="spacer"></span>
      <button class="icon" data-act="account" aria-label="My account">☰</button>
    </header>
    <nav class="tabs" id="a-tabs" aria-label="Admin sections"></nav>
    <div class="scroll" id="a-scroll"><div class="inner" id="a-body"></div></div>
  </section>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
